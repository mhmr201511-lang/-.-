<title>منصة درجاتي</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a teal header band, then one working sheet — tabs, toolbar, and a dense grade grid with a sticky name column */
:root{
  --bg:#EEF3F1; --surface:#FFFFFF; --sunk:#F5F8F7; --ink:#12302B; --muted:#5A6F6A; --line:#D5E0DC;
  --accent:#0F6B5C; --accent-ink:#FFFFFF; --accent-soft:#DDEFEA; --gold:#9A6F17; --gold-soft:#F6EBD2;
  --danger:#B3261E; --danger-soft:#FBE3E1; --ok:#1D7A46; --frame:#12302B;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1614; --surface:#14201D; --sunk:#101A18; --ink:#E3EEEA; --muted:#93A8A2; --line:#263732;
  --accent:#3DB39C; --accent-ink:#06201B; --accent-soft:#16332D; --gold:#DDB45C; --gold-soft:#33291A;
  --danger:#F08A82; --danger-soft:#3A1D1B; --ok:#5CCB8A; --frame:#9CC9BE; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1614; --surface:#14201D; --sunk:#101A18; --ink:#E3EEEA; --muted:#93A8A2; --line:#263732;
  --accent:#3DB39C; --accent-ink:#06201B; --accent-soft:#16332D; --gold:#DDB45C; --gold-soft:#33291A;
  --danger:#F08A82; --danger-soft:#3A1D1B; --ok:#5CCB8A; --frame:#9CC9BE; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--accent);color:var(--accent-ink)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{flex:none}
.brand h1{font-family:var(--f-display);font-size:20px;margin:0;line-height:1.2}
.brand small{display:block;opacity:.85;font-size:13px}
.who{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.sync{opacity:.85}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost-on-accent{background:transparent;color:var(--accent-ink);border-color:currentColor;opacity:.9}
.btn.danger{color:var(--danger);border-color:var(--danger-soft)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{padding:3px 10px;font-size:13px}
main{padding-block:22px 48px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
h2{font-family:var(--f-display);font-size:18px;margin:0 0 4px;text-wrap:balance}
h3{font-family:var(--f-display);font-size:16px;margin:0}
.muted{color:var(--muted)}
.field{display:grid;gap:5px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 12px}
textarea.input{min-height:130px;resize:vertical;font-family:var(--f-body)}
.err{color:var(--danger);font-size:13px;min-height:1.2em}
/* login */
.login{max-width:440px;margin:24px auto;display:grid;gap:16px}
.seg{display:flex;background:var(--sunk);border:1px solid var(--line);border-radius:9px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:7px 10px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stack{display:grid;gap:12px}
.dist{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;font-size:13px}
.dist div{background:var(--sunk);border-radius:8px;padding:8px 10px}
.dist b{font-family:var(--f-display);font-size:17px;display:block}
/* teacher */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:500;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.toolbar .seg{flex:none}
.toolbar .input{width:auto;min-width:0}
.weeks{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.weeks button{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-width:40px;padding:4px 10px;cursor:pointer;font-variant-numeric:tabular-nums}
.weeks button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.weeks button.done:not([aria-pressed="true"]){border-color:var(--accent);color:var(--accent)}
.hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
.grid th,.grid td{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:4px 6px;text-align:center;white-space:nowrap}
.grid thead th{background:var(--sunk);font-weight:600;font-size:13px;position:relative}
.grid thead tr.crit th{font-weight:500;color:var(--muted);font-size:12px}
.grid .sess-b{border-left:2px solid var(--accent)}
.grid .ss{border-right:3px solid var(--frame)}
.grid .se{border-left:3px solid var(--frame)}
.grid th.sh{border-top:3px solid var(--frame);border-right:3px solid var(--frame);border-left:3px solid var(--frame);font-family:var(--f-display)}
.grid tbody tr:last-child td.sc{border-bottom:3px solid var(--frame)}
.subseg{margin-bottom:12px}
.msgwrap{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:760px){.msgwrap{grid-template-columns:1fr}}
.threads{display:grid;gap:4px;max-height:560px;overflow:auto;margin:0;padding:0;list-style:none}
.threads button{width:100%;text-align:right;border:1px solid transparent;background:var(--sunk);border-radius:8px;padding:8px 10px;cursor:pointer;display:grid;gap:2px}
.threads button[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.threads .tn{display:flex;justify-content:space-between;gap:6px;font-weight:600}
.threads .tl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newdot{background:var(--danger);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;font-weight:600}
.convo{display:grid;gap:10px;min-width:0}
.msglist{height:420px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:12px;background:var(--sunk);border-radius:var(--r);border:1px solid var(--line)}
.bub{max-width:78%;padding:8px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);align-self:flex-end;white-space:pre-wrap;overflow-wrap:anywhere}
.bub.me{align-self:flex-start;background:var(--accent-soft);border-color:transparent}
.bub small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.bub img{display:block;max-width:220px;max-height:220px;border-radius:8px;margin-top:6px}
.mfile{display:inline-flex;gap:6px;align-items:center;margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:4px 10px;background:var(--surface);color:var(--ink);text-decoration:none;font-size:13px}
.composer{display:grid;gap:8px}
.composer textarea{min-height:70px}
.crow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fchip{display:inline-flex;gap:6px;align-items:center;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 4px 2px 10px;font-size:13px}
.tabs .newdot{margin-right:4px}
:root{--ring-bg:#DCE7E3;--gold-ink:#7A560C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ring-bg:#22332F;--gold-ink:#EBC777}}
:root[data-theme="dark"]{--ring-bg:#22332F;--gold-ink:#EBC777}
.weeks button{position:relative}
.weeks button.pub::after{content:"";position:absolute;top:-3px;left:-3px;width:9px;height:9px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.pubrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:-4px 0 12px;font-size:13px}
.state{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-weight:600;font-size:12px}
.state.on{background:var(--accent-soft);color:var(--ok)}
.state.off{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.wtoggle{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px}
.wtoggle button{border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:6px 0;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--muted)}
.wtoggle button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
/* student */
.st-hero{background-color:var(--accent);color:var(--accent-ink);border-radius:16px;padding:22px 22px 24px;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.14) 1.2px,transparent 0);background-size:18px 18px}
.st-hero .hello{font-size:14px;opacity:.85}

.msgtile{width:100%;display:flex;align-items:center;gap:12px;text-align:right;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}
.msgtile:hover{border-color:var(--accent)}

.msgtile small{color:var(--muted)}

.msgbox{margin-top:14px}
.msgbox .mh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pc{margin-top:18px;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pc-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--sunk)}

.pc-b{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(170px,220px);gap:22px;align-items:center;padding:18px}
@media (max-width:760px){.pc-b{grid-template-columns:auto minmax(0,1fr)}.medal{grid-column:1/-1}}
@media (max-width:460px){.pc-b{grid-template-columns:1fr;justify-items:center}.bars{width:100%}}
.ring .rv{fill:var(--ink);font-family:var(--f-display);font-size:32px;font-weight:700}
.ring .rl{fill:var(--muted);font-size:12px}
.bars{display:grid;gap:10px}
.bl{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.bl b{color:var(--ink);font-family:var(--f-display);font-variant-numeric:tabular-nums}
.bl b small{color:var(--muted);font-weight:400;font-family:var(--f-body)}
.track{height:8px;background:var(--ring-bg);border-radius:999px;overflow:hidden;margin-top:4px}

.medal{background:var(--gold-soft);border-radius:14px;padding:14px;color:var(--gold-ink);display:grid;gap:8px}
.medal .mtop{display:flex;align-items:center;gap:10px}
.medal b{font-family:var(--f-display);font-size:26px;line-height:1}

.medal .chips span{background:var(--surface);border-radius:999px;padding:1px 9px;font-size:12px}
.pc-w{padding:4px 18px 18px}
.pc-w h3{font-size:14px;color:var(--muted);font-weight:500;margin:0 0 8px}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.wk{position:relative;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:8px 6px 10px;cursor:pointer;display:grid;gap:2px;justify-items:center;font-variant-numeric:tabular-nums}
.wk small{color:var(--muted);font-size:11px}
.wk b{font-family:var(--f-display);font-size:19px;line-height:1.2}
.wk .wf{width:70%;height:4px;background:var(--ring-bg);border-radius:9px;overflow:hidden}
.wk .wf i{display:block;height:100%;background:var(--accent)}
.wk.full b{color:var(--accent)}
.wk[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.wk.flag::after{content:"";position:absolute;top:6px;left:6px;width:7px;height:7px;border-radius:50%;background:var(--danger)}
.wk.locked{cursor:default;border-style:dashed;background:transparent;color:var(--muted)}
.wdetail{margin-top:12px;border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
.wd-h{display:flex;justify-content:space-between;align-items:center}
.wd-h b{font-family:var(--f-display);font-size:20px;color:var(--accent)}
.sess2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.sess{border:2px solid var(--frame);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.sess .sn{font-family:var(--f-display);font-weight:600}
.critrow{display:grid;grid-template-columns:1fr auto 36px;gap:8px;align-items:center;font-size:13px}
.critrow b{text-align:left;font-variant-numeric:tabular-nums}
.pips{display:inline-flex;gap:4px}

.closed{margin-top:18px;border:1px dashed var(--line);border-radius:16px;padding:18px;display:flex;align-items:center;gap:12px;color:var(--muted)}

.dcell{display:inline-flex;align-items:center;gap:3px}
.ded{border:1px solid var(--danger-soft);background:var(--danger-soft);color:var(--danger);border-radius:6px;width:22px;height:26px;padding:0;cursor:pointer;font-weight:700;line-height:1}
.ded:hover{border-color:var(--danger)}
.ded b{font-size:10px;font-weight:600}
.pop .beh{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;background:var(--sunk);border-radius:6px;padding:3px 8px}
.behlog{margin:0;padding:0;list-style:none;display:grid;gap:4px;font-size:13px}
.behlog li{display:flex;justify-content:space-between;gap:10px;background:var(--danger-soft);color:var(--danger);border-radius:6px;padding:4px 10px}
.grid .name{background:var(--surface);text-align:right;min-width:190px;max-width:260px;white-space:normal}
.grid thead .name{background:var(--sunk)}
.grid .name .idx{display:inline-block;min-width:22px;color:var(--muted);font-size:12px}
.grid .name small{display:block;color:var(--muted);font-size:12px;padding-right:22px}
@media (hover:hover){.grid tbody tr:hover td{background:var(--sunk)}}
.scroll{-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.fwrap{position:relative}
.freeze{position:absolute;top:1px;right:1px;background:var(--surface);border-left:1px solid var(--line);border-top-right-radius:var(--r);overflow:hidden;z-index:2;pointer-events:none}
.fz-h{background:var(--sunk);display:flex;align-items:center;padding:0 8px;font-weight:600;font-size:13px;border-bottom:1px solid var(--line)}
.fz-r{display:flex;align-items:center;padding:0 6px;border-bottom:1px solid var(--line);overflow:hidden;line-height:1.35}

@media (max-width:640px){.grid .name{min-width:130px;max-width:150px;font-size:13px}.grid th,.grid td{padding:3px 4px}input.cell{width:38px}.grid thead tr.crit th{white-space:normal;min-width:52px;line-height:1.3}}
.fill{border:1px dashed var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:6px;padding:1px 10px;cursor:pointer;font-weight:600;font-variant-numeric:tabular-nums}
.fill:hover{border-style:solid}
.fill.gold{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}

td.calc{font-weight:600}
td.calc.tot{color:var(--accent);font-family:var(--f-display)}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:13px;background:var(--gold-soft);color:var(--gold);font-weight:600}
.pop{position:fixed;z-index:50;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:10px;width:240px;display:grid;gap:6px}

.pop .row{display:flex;gap:6px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;align-items:start}
.list{display:grid;gap:6px;margin:10px 0 0;padding:0;list-style:none}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--sunk);border-radius:8px;padding:6px 10px}
.row3{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:4px}
/* student */
.st-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.st-head h2{font-size:22px}
.period{margin-top:18px;display:grid;gap:12px}
.ptop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:stretch}

.login{width:100%}

  .input,select.input,textarea.input,input.cell{font-size:16px}

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
/* ضع هنا إعدادات مشروعك من Firebase (Project settings > Your apps > SDK setup and configuration > Config) */
const FIREBASE_CONFIG = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
/* Teacher usernames become Firebase logins like "ahmad@daragati.app". No real email is needed. */
const TEACHER_DOMAIN = "daragati.app";

(function(){
  if(!FIREBASE_CONFIG.apiKey||!window.firebase)return;
  firebase.initializeApp(FIREBASE_CONFIG);
  const auth=firebase.auth(),fs=firebase.firestore();
  const email=u=>u+"@"+TEACHER_DOMAIN;
  // Everyone gets a Firebase identity: teachers by password, students anonymously (needed for messages).
  const authReady=new Promise(res=>{const off=auth.onAuthStateChanged(async u=>{off();
    if(!u){try{await auth.signInAnonymously()}catch(e){console.warn("Anonymous sign-in is off",e)}}res()})});
  const teacherName=()=>{const u=auth.currentUser;return u&&!u.isAnonymous&&u.email?u.email.split("@")[0]:null};
  window.claude={
    async use(name){await authReady;
      if(name==="db")return fs;
      if(name==="user")return{
        async canEdit(){const t=teacherName();if(!t)return false;try{return (await fs.doc("data/staff/teachers/"+t).get()).exists}catch{return false}},
        async id(){return auth.currentUser?auth.currentUser.uid:null}};
      if(name==="downloads")return{async save({filename,data}){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:"text/html;charset=utf-8"}));
        a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}};
      return null},
    auth:{
      teacher:teacherName,
      signIn:(u,pw)=>auth.signInWithEmailAndPassword(email(u),pw),
      async setup(u,pw,name){
        await auth.createUserWithEmailAndPassword(email(u),pw).catch(e=>{if(e.code==="auth/email-already-in-use")return auth.signInWithEmailAndPassword(email(u),pw);throw e});
        const b=fs.batch();b.set(fs.doc("data/staff/teachers/"+u),{name});b.set(fs.doc("meta/bootstrap"),{at:new Date().toISOString(),by:u});await b.commit()},
      async createTeacher(u,pw){ // a second app instance so the current teacher stays signed in
        const sec=firebase.apps.find(a=>a.name==="sec")||firebase.initializeApp(FIREBASE_CONFIG,"sec");
        try{await sec.auth().createUserWithEmailAndPassword(email(u),pw)}finally{await sec.auth().signOut().catch(()=>{})}},
      async changePassword(cur,next){const u=auth.currentUser;
        await u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,cur));await u.updatePassword(next)},
      signOut:()=>auth.signOut()
    }};
})();
</script>
<script>
document.documentElement.lang="ar";document.documentElement.dir="rtl";
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2=n=>Math.round(n*100)/100;
const rnd=x=>x==null||Number.isNaN(x)?x:Math.floor(x+0.5+1e-9);
const fmt=n=>n==null||Number.isNaN(n)?"—":String(r2(n));
const CRIT=["مشاركة","المنصة","تقويم الكتاب","أنشطة الكتاب","الانضباط"];
const EXAMS=[{l:"اختبار المنصة 1",m:15},{l:"اختبار المنصة 2",m:15},{l:"الاختبار الحضوري",m:30}];
const DEF={school:"متوسطة كعب بن عمرو الخزرجي",subject:"",p1:{from:1,to:8},p2:{from:9,to:17},
  open:{p1:false,p2:false},openWeeks:[],extras:[{k:"radio",label:"الإذاعة",max:2},{k:"act",label:"المشاركة في الأنشطة",max:3},{k:"pres",label:"العرض التقديمي",max:2}]};
const PN={p1:"الفترة الأولى",p2:"الفترة الثانية"};
const BEH={sleep:"نوم",talk:"حديث جانبي",chaos:"إثارة فوضى",late:"تأخر عن الحصة",book:"نسيان الكتاب"};const DED=0.5;
const behList=(g,a)=>((g.beh||{})[a]||[]);

const S={db:null,user:null,canEdit:false,noDb:false,settings:null,students:new Map(),grades:new Map(),remote:new Set(),
  teachers:null,session:null,uid:null,inbox:new Map(),thread:null,msgs:[],msgsFor:null,draft:"",pfile:null,tab:"weekly",xmode:"week",period:"p1",week:1,cls:"",q:"",loginMode:"s",loaded:false,teachersEmpty:null};

function cfg(){const s=S.settings||{};return{...DEF,...s,p1:{...DEF.p1,...(s.p1||{})},p2:{...DEF.p2,...(s.p2||{})},open:{...DEF.open,...(s.open||{})},openWeeks:Array.isArray(s.openWeeks)?s.openWeeks.map(Number):[],extras:Array.isArray(s.extras)?s.extras:DEF.extras}}
const isOpenP=p=>!!cfg().open[p], isOpenW=w=>cfg().openWeeks.includes(w);
function visWeeks(p){return weeksOf(p).filter(isOpenW)}
function weeksOf(p){const c=cfg()[p];const a=[];for(let w=+c.from;w<=+c.to;w++)a.push(w);return a}

/* ---------- calculations ---------- */
const G=nid=>S.grades.get(nid)||{};
const num=v=>typeof v==="number"&&!Number.isNaN(v)?v:null;
function weekArr(g,w){return (g.w&&g.w["w"+w])||[]}
function weekTotal(g,w){const a=weekArr(g,w);let s=0,any=false;for(const v of a){if(num(v)!=null){s+=v;any=true}}return any?s:null}
function critSum(g,w,c){const a=weekArr(g,w);const x=num(a[c]),y=num(a[c+5]);return x==null&&y==null?null:(x||0)+(y||0)}
function weeksSum(g,p){let s=0;for(const w of weeksOf(p)){s+=weekTotal(g,w)||0}return s}
function tasksImported(g,p){return weeksSum(g,p)===0&&num((g.tov||{})[p])!=null}
function tasks(g,p){if(tasksImported(g,p))return g.tov[p];const n=weeksOf(p).length;return n?weeksSum(g,p)/(n*20)*40:0}
function exam(g,p,i){return num(((g.ex||{})[p]||[])[i])}
function examsSum(g,p){let s=0;for(let i=0;i<3;i++)s+=exam(g,p,i)||0;return s}
function total(g,p){return tasks(g,p)+examsSum(g,p)}
function xwk(g,w,k){return num(((g.xw||{})["w"+w]||{})[k])}
function xval(g,p,k){let s=num(((g.x||{})[p]||{})[k]),any=s!=null;s=s||0;for(const w of weeksOf(p)){const v=xwk(g,w,k);if(v!=null){s+=v;any=true}}return any?s:null}
function sTasks(g,p){if(tasksImported(g,p))return g.tov[p];const n=weeksOf(p).length;let s=0;for(const w of visWeeks(p))s+=weekTotal(g,w)||0;return n?s/(n*20)*40:0}
function sX(g,p,k){let s=num(((g.x||{})[p]||{})[k]),any=s!=null;s=s||0;for(const w of visWeeks(p)){const v=xwk(g,w,k);if(v!=null){s+=v;any=true}}return any?s:null}
function sXsum(g,p){return cfg().extras.reduce((a,t)=>a+(sX(g,p,t.k)||0),0)}
function fin(g,p){const t=rnd(tasks(g,p)),e=rnd(examsSum(g,p)),x=r2(xsum(g,p));
  const u40=Math.min(Math.max(0,40-t),x),u60=Math.min(Math.max(0,60-e),x-u40);
  const t2=r2(t+u40),e2=r2(e+u60);return {t:t2,e:e2,T:r2(t2+e2),x,u:r2(u40+u60),s:r2(x-u40-u60),b:t+e}}
function xweek(g,w){let s=0;for(const t of cfg().extras)s+=xwk(g,w,t.k)||0;return s}
function xsum(g,p){let s=0;for(const t of cfg().extras)s+=xval(g,p,t.k)||0;return s}

/* ---------- storage ---------- */
function saveSession(){try{sessionStorage.setItem("rasd.session",JSON.stringify(S.session))}catch{}}
function restoreSession(){try{S.session=JSON.parse(sessionStorage.getItem("rasd.session")||"null");const t=sessionStorage.getItem("rasd.tab");if(t){S.tab=t;sessionStorage.removeItem("rasd.tab")}}catch{}}
function reloadTo(tab){try{sessionStorage.setItem("rasd.tab",tab)}catch{}location.reload()}
const toEn=t=>String(t||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[۰-۹]/g,d=>"۰۱۲۳۴۵۶۷۸۹".indexOf(d));
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function toast(m){const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200)}
function setSync(s){S.sync=s;const el=$("#syncTxt");if(el)el.textContent=s==="saving"?"جارٍ الحفظ…":s==="err"?"تعذّر الحفظ":"كل التغييرات محفوظة"}

/* ---------- write queue (one write at a time per student) ---------- */
const dirty=new Map(),inflight=new Set();let pumpT=null;
function merge(a,b){const o={...a};for(const k in b){const v=b[k];o[k]=v&&typeof v==="object"&&!Array.isArray(v)&&a[k]&&typeof a[k]==="object"&&!Array.isArray(a[k])?merge(a[k],v):v}return o}
function queue(nid,patch){dirty.set(nid,merge(dirty.get(nid)||{},patch));setSync("saving");clearTimeout(pumpT);pumpT=setTimeout(pump,450)}
function pump(){for(const nid of [...dirty.keys()]){if(inflight.size>=5)break;if(inflight.has(nid))continue;const patch=dirty.get(nid);dirty.delete(nid);inflight.add(nid);
  write(nid,patch).finally(()=>{inflight.delete(nid);if(dirty.size)pump();else if(!inflight.size&&S.sync!=="err")setSync("saved")})}}
async function write(nid,patch,retry){const ref=S.db.doc("grades/"+nid);
  try{if(S.remote.has(nid))await ref.update(patch);else{await ref.set({...JSON.parse(JSON.stringify(G(nid))),nid});S.remote.add(nid)}}
  catch(e){if(e&&e.code==="unavailable"&&!retry){await new Promise(r=>setTimeout(r,600+Math.random()*600));return write(nid,patch,true)}
    setSync("err");toast(e&&(e.code==="invalid_argument"||e.code==="permission-denied")?"لم يُحفظ الرصد: لا تملك صلاحية رصد الدرجات.":"تعذّر حفظ الدرجات، حاول مرة أخرى.")}}
function editG(nid,fn){const g=JSON.parse(JSON.stringify(G(nid)));fn(g);S.grades.set(nid,g)}
function setCell(nid,k,a,i,v){
  if(k==="w")editG(nid,g=>{g.w=g.w||{};const arr=(g.w[a]||Array(10).fill(null)).slice();while(arr.length<10)arr.push(null);arr[i]=v;g.w[a]=arr;queue(nid,{w:{[a]:arr}})});
  else if(k==="ex")editG(nid,g=>{g.ex=g.ex||{};const arr=(g.ex[a]||[null,null,null]).slice();arr[i]=v;g.ex[a]=arr;queue(nid,{ex:{[a]:arr}})});
  else if(k==="xw")editG(nid,g=>{g.xw=g.xw||{};g.xw[a]={...(g.xw[a]||{}),[i]:v};queue(nid,{xw:{[a]:{[i]:v}}})});
  else if(k==="x")editG(nid,g=>{g.x=g.x||{};g.x[a]={...(g.x[a]||{}),[i]:v};queue(nid,{x:{[a]:{[i]:v}}})});
}

/* ---------- boot ---------- */
async function boot(){
  restoreSession();render();
  if(!window.claude||!claude.use){S.noDb=true;render();return}
  const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
  S.db=db;S.user=user;
  if(!db){S.noDb=true;render();return}
  try{S.canEdit=user?!!(await user.canEdit()):false}catch{}
  try{S.uid=user?await user.id():null}catch{}
  const fail=()=>{};
  db.doc("settings/main").onSnapshot(s=>{S.settings=s.exists?s.data():null;$("#school").textContent=cfg().school+(cfg().subject?" · "+cfg().subject:"");render()},fail);
  db.doc("meta/bootstrap").onSnapshot(s=>{S.teachersEmpty=!s.exists;if(!S.session)render()},fail);
  if(S.session&&S.session.role==="t"&&!S.canEdit){S.session=null;saveSession()}
  if(S.canEdit){
    db.collection("students").onSnapshot(q=>{S.students=new Map(q.docs.map(d=>[d.id,d.data()]));S.loaded=true;render()},fail);
    db.collection("grades").onSnapshot(q=>{S.remote=new Set(q.docs.map(d=>d.id));
      for(const d of q.docs){if(!dirty.has(d.id)&&!inflight.has(d.id))S.grades.set(d.id,d.data())}
      for(const id of [...S.grades.keys()])if(!S.remote.has(id)&&!dirty.has(id)&&!inflight.has(id))S.grades.delete(id);
      if(S.session&&S.session.role==="t"&&["weekly","exams","extras","summary","final"].includes(S.tab))refreshValues();else render()},fail);
    db.doc("data/staff/meta/lock").onSnapshot(s=>{S.lock=s.exists?s.data().hash:null;S.lockLoaded=true;if(S.tab==="ids")render()},fail);
    db.collection("data/staff/teachers").onSnapshot(q=>{S.teachers=q.docs.map(d=>({u:d.id,...d.data()}));if(S.tab==="settings")render()},fail);
  }
  if(S.session&&S.session.role==="s")watchStudent(S.session.id);
  if(S.session&&S.session.role==="s")startStudentInbox();
  if(S.session&&S.session.role==="t")startTeacherInbox();
  render();
}

function watchStudent(nid){if(S.watching===nid)return;S.watching=nid;
  S.db.doc("students/"+nid).onSnapshot(s=>{S.students=new Map(s.exists?[[nid,s.data()]]:[]);S.loaded=true;render()},()=>{S.loaded=true;render()});
  S.db.doc("grades/"+nid).onSnapshot(s=>{if(s.exists)S.grades.set(nid,s.data());else S.grades.delete(nid);render()},()=>{})}

/* ---------- messages ---------- */
const fmtTime=t=>{try{return new Date(t).toLocaleString("ar-SA-u-nu-latn",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}catch{return ""}};
const fmtSize=b=>b>1048576?(b/1048576).toFixed(1)+" م.ب":Math.max(1,Math.round(b/1024))+" ك.ب";
function startTeacherInbox(){if(!S.db||S.tInbox)return;S.tInbox=true;
  S.db.collection("inbox").onSnapshot(q=>{S.inbox=new Map(q.docs.map(d=>[d.id,d.data()]));updateMsgBadge();if(S.tab==="messages")renderThreads()},()=>{})}
async function startStudentInbox(){if(!S.db||S.stInbox)return;S.stInbox=true;
  if(!S.uid){S.msgOk=false;S.msgWhy="signin";render();return}
  const nid=S.session.id,ref=S.db.doc("inbox/"+S.uid);
  try{const snap=await ref.get();const st=(await S.db.doc("students/"+nid).get()).data()||{};const old=snap.exists?snap.data():{};
    if(!snap.exists)await ref.set({nid,name:st.name||"",cls:st.cls||"",lastAt:null,lastFrom:null,lastText:"",tSeen:null,sSeen:null});
    else if(old.nid!==nid||old.name!==st.name)await ref.update({nid,name:st.name||"",cls:st.cls||""});
    S.msgOk=true}catch(e){S.msgOk=false;S.msgWhy="perm"}
  ref.onSnapshot(s=>{S.myThread=s.exists?s.data():null;if(!S.msgOpen&&S.session&&S.session.role==="s")render()},()=>{});
  subMsgs(S.uid);render()}
function subMsgs(uid){if(S.unsubMsgs)S.unsubMsgs();S.msgs=[];S.msgsFor=uid;
  S.unsubMsgs=S.db.collection("inbox/"+uid+"/msgs").orderBy("at").limit(500).onSnapshot(q=>{S.msgs=q.docs.map(d=>({id:d.id,...d.data()}));renderMsgs()},()=>{})}
function threadNid(){return S.session.role==="t"?((S.inbox.get(S.thread)||{}).nid):S.session.id}
function unreadThreads(){let n=0;for(const t of S.inbox.values())if(t.lastFrom==="s"&&(!t.tSeen||t.lastAt>t.tSeen))n++;return n}
function updateMsgBadge(){const b=$("#msgBadge");if(!b)return;const n=unreadThreads();b.textContent=n;b.hidden=!n}
function fileHTML(f){if(!f)return "";const src=f.id?"/_blob/"+f.id:(f.data||"");if(!src)return "";
  if(/^image\//.test(f.type||""))return `<a href="${esc(src)}" target="_blank" rel="noopener"><img src="${esc(src)}" alt="${esc(f.name||"صورة")}" loading="lazy"></a>`;
  return `<a class="mfile" href="${esc(src)}" target="_blank" rel="noopener"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>${esc(f.name||"ملف")} · ${fmtSize(f.size||0)}</a>`}
function renderMsgs(){const box=$("#msgList");if(!box)return;const me=S.session.role==="t"?"t":"s";const nid=threadNid();
  const list=S.msgs.filter(m=>!m.nid||m.nid===nid);
  box.innerHTML=list.length?list.map(m=>`<div class="bub${m.from===me?" me":""}">${m.text?esc(m.text):""}${fileHTML(m.file)}<small>${m.from==="t"?esc(m.by||"المعلم"):"الطالب"} · ${fmtTime(m.at)}</small></div>`).join("")
    :`<div class="empty" style="margin:auto">${me==="t"?"لا توجد رسائل مع هذا الطالب بعد. اكتب أول رسالة بالأسفل.":"لا توجد رسائل بعد. يمكنك مراسلة معلمك من هنا."}</div>`;
  box.scrollTop=box.scrollHeight;
  const last=[...list].reverse().find(m=>m.from!==me);const uid=me==="t"?S.thread:S.uid;const th=me==="t"?S.inbox.get(uid):S.myThread;const key=me==="t"?"tSeen":"sSeen";
  if(last&&uid&&th&&(!th[key]||th[key]<last.at)&&S.seenW!==uid+last.at){S.seenW=uid+last.at;S.db.doc("inbox/"+uid).update({[key]:last.at}).catch(()=>{})}}
function renderThreads(){const box=$("#thList");if(!box)return;const q=(S.mq||"").trim();
  const arr=[...S.inbox.entries()].filter(([,t])=>!q||String(t.name).includes(q)).sort((a,b)=>String(b[1].lastAt||"").localeCompare(String(a[1].lastAt||""))||String(a[1].name).localeCompare(String(b[1].name),"ar"));
  box.innerHTML=arr.length?arr.map(([uid,t])=>{const nw=t.lastFrom==="s"&&(!t.tSeen||t.lastAt>t.tSeen);
    return `<li><button data-act="thread" data-u="${esc(uid)}" aria-current="${S.thread===uid}"><span class="tn"><span>${esc(t.name||"طالب")}</span>${nw?`<span class="newdot">جديد</span>`:""}</span><span class="tl">${esc(t.cls?"الفصل "+t.cls+" · ":"")}${esc(t.lastText||"لا رسائل")}</span></button></li>`}).join("")
    :`<li class="muted" style="padding:10px;font-size:13px">لا يظهر هنا إلا الطلاب الذين دخلوا المنصة مرة واحدة على الأقل.</li>`;
  updateMsgBadge()}
function composerHTML(){return `<div class="composer"><textarea class="input" id="mText" placeholder="اكتب رسالتك…">${esc(S.draft)}</textarea>
  <div class="crow"><label class="btn" for="mFile" style="cursor:pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 11.5l-8.6 8.6a5 5 0 0 1-7-7l8.6-8.6a3.3 3.3 0 0 1 4.7 4.7l-8.6 8.6a1.7 1.7 0 0 1-2.4-2.4l7.9-7.9"/></svg>إرفاق ملف</label>
  <input type="file" id="mFile" hidden><span id="fChip"></span><span style="flex:1"></span><button class="btn primary" data-act="send" id="sendBtn">إرسال</button></div></div>`}

function readDataURL(b){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)})}
async function shrinkImage(file){const url=URL.createObjectURL(file);try{const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
  for(const [m,qq] of [[1400,.72],[1000,.6],[720,.5]]){const k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);const d=c.toDataURL("image/jpeg",qq);if(d.length<240000)return d}return null}finally{URL.revokeObjectURL(url)}}
async function uploadFile(file){if(file.size>20*1048576)throw new Error("!حجم الملف أكبر من 20 ميجابايت.");
  let assets=null;try{assets=await claude.use("assets")}catch{}
  if(assets){try{const r=await assets.upload(file);return {id:r.id,name:file.name,type:r.contentType||file.type,size:file.size}}catch(e){}}
  if(/^image\/(png|jpe?g|webp|gif)$/.test(file.type)){const d=await shrinkImage(file);if(d)return {name:file.name,type:"image/jpeg",size:Math.round(d.length*.75),data:d}}
  if(file.size<=170*1024)return {name:file.name,type:file.type||"application/octet-stream",size:file.size,data:await readDataURL(file)};
  throw new Error("!تعذّر رفع هذا الملف. أرسل صورة، أو ملفًا أصغر من 170 كيلوبايت.")}
async function sendMsg(){if(S.sending)return;const text=($("#mText")?.value||"").trim();const file=S.pfile;if(!text&&!file)return;

  try{const f=file?await uploadFile(file):null;const at=new Date().toISOString();
    await S.db.collection("inbox/"+uid+"/msgs").add({from:me,nid,text,file:f,at,by:me==="t"?S.session.name:""});
    await S.db.doc("inbox/"+uid).update({lastAt:at,lastFrom:me,lastText:(text||("مرفق: "+file.name)).slice(0,80),[me==="t"?"tSeen":"sSeen"]:at}).catch(()=>{});

  catch(e){toast(e&&e.message&&e.message[0]==="!"?e.message.slice(1):"تعذّر إرسال الرسالة. حاول مرة أخرى.")}

/* ---------- live values in grade tables ---------- */
function calcFor(nid,spec){const g=G(nid),p=S.period;
  if(spec==="wk")return weekTotal(g,S.week);
  if(spec[0]==="F"){const f=fin(g,p);return f[spec.slice(1)]}
  if(spec==="tasks")return rnd(tasks(g,p));if(spec==="exs")return examsSum(g,p);if(spec==="total")return rnd(rnd(tasks(g,p))+examsSum(g,p));
  if(spec==="wsum")return weeksSum(g,p);if(spec==="xwk")return xweek(g,S.week);if(spec.startsWith("xt:"))return xval(g,p,spec.slice(3));if(spec==="xs")return xsum(g,p);
  if(spec.startsWith("w:"))return weekTotal(g,+spec.slice(2));if(spec.startsWith("e:"))return exam(g,p,+spec.slice(2));return null}
function inputVal(el){const g=G(el.dataset.nid),k=el.dataset.k,a=el.dataset.a,i=el.dataset.i;
  if(k==="w")return num(((g.w||{})[a]||[])[+i]);if(k==="xw")return num(((g.xw||{})[a]||{})[i]);if(k==="ex")return num(((g.ex||{})[a]||[])[+i]);return num(((g.x||{})[a]||{})[i])}

function refreshValues(){$$("input.cell").forEach(el=>{if(el!==document.activeElement){const v=inputVal(el);el.value=v==null?"":String(v);el.classList.remove("bad")}});

function addBeh(t){const d=S.ded;if(!d)return;const di=d.s*5+4;let floor=false;
  editG(d.nid,g=>{const list=behList(g,d.a).slice();list.push({s:d.s,t});g.beh={...(g.beh||{}),[d.a]:list};
    const arr=((g.w||{})[d.a]||Array(10).fill(null)).slice();while(arr.length<10)arr.push(null);const cur=num(arr[di]);const base=cur==null?2:cur;
    if(base<=0)floor=true;arr[di]=Math.max(0,r2(base-DED));g.w={...(g.w||{}),[d.a]:arr};queue(d.nid,{w:{[d.a]:arr},beh:{[d.a]:list}})});
  refreshValues();toast(floor?"سُجّل السلوك، والانضباط صفر بالفعل":`خُصم ${DED} من الانضباط: ${BEH[t]}`);openDed(d.nid,d.a,d.s)}

    try{await S.db.doc("data/staff/teachers/"+u).set({name:n})}catch{er.textContent="تعذّر الحفظ: لا تملك صلاحية إدارة الحسابات.";return}
    try{await claude.auth.createTeacher(u,pw)}catch(x){if(!(x&&x.code==="auth/email-already-in-use")){er.textContent="أُضيف المعلم للقائمة لكن تعذّر إنشاء كلمة المرور. احذفه وأعد المحاولة.";return}
      toast("اسم المستخدم كان مسجّلًا من قبل، فيدخل المعلم بكلمة مروره السابقة.")}
    e.target.reset();toast("أُضيف المعلم")}
  else if(f==="fAdd"){const nid=$("#a_nid").value.trim(),name=$("#a_name").value.trim(),cls=$("#a_cls").value.trim();
    if(!/^\d{10}$/.test(nid)){toast("رقم الهوية يتكون من 10 أرقام.");return}
    try{await S.db.doc("students/"+nid).set({nid,name,cls});e.target.reset();$("#a_nid").focus();toast("أُضيف "+name)}catch{toast("تعذّر الحفظ: لا تملك صلاحية التعديل.")}}
  else if(f==="fSet"){const p1={from:+$("#p1f").value,to:+$("#p1t").value},p2={from:+$("#p2f").value,to:+$("#p2t").value};
    if(![p1,p2].every(p=>p.from>=1&&p.to>=p.from&&p.to<=60)){$("#eSet").textContent="تحقق من أرقام الأسابيع.";return}
    await saveSettings({school:$("#s_school").value.trim()||DEF.school,subject:$("#s_subject").value.trim(),p1,p2});toast("حُفظت الإعدادات")}
  else if(f==="fMyPw"){const er=$("#eMy");const cur=$("#mp0").value,n1=toEn($("#mp1").value.trim()),n2=toEn($("#mp2").value.trim());
    if(n1.length<6){er.textContent="كلمة المرور الجديدة 6 أحرف على الأقل.";return}
    if(n1!==n2){er.textContent="كلمتا المرور غير متطابقتين.";return}
    let ok=false;for(const c of new Set([cur,toEn(cur),cur.trim(),toEn(cur.trim())])){try{await claude.auth.changePassword(c,n1);ok=true;break}catch(x){if(x&&x.code==="auth/too-many-requests")break}}
    if(!ok){er.textContent="كلمة المرور الحالية غير صحيحة.";return}
    e.target.reset();er.textContent="";toast("تم تغيير كلمة المرور")}
  else if(f==="fLockSet"||f==="fLockChange"){const c=f==="fLockSet"?$("#lk1").value.trim():$("#lkn").value.trim();
    if(!/^\d{5}$/.test(c)){toast("الرمز يتكون من 5 أرقام.");if($("#eLock"))$("#eLock").textContent="الرمز يتكون من 5 أرقام.";return}
    if(f==="fLockSet"&&c!==$("#lk2").value.trim()){$("#eLock").textContent="الرمزان غير متطابقين.";return}
    try{await S.db.doc("data/staff/meta/lock").set({hash:await sha("lock|"+c)});S.idOpen=f==="fLockChange";toast("حُفظ الرمز");render()}catch{toast("تعذّر الحفظ: تغيير الرمز للمالك فقط.")}}
  else if(f==="fUnlock"){const c=$("#lku").value.trim();if(S.lock&&await sha("lock|"+c)===S.lock){S.idOpen=true;render()}else{$("#eUnlock").textContent="الرمز غير صحيح.";$("#lku").value=""}}
  else if(f==="fX"){const label=$("#xl").value.trim(),max=parseFloat($("#xm").value.replace(",","."));
    if(!label||!(max>0)){toast("اكتب اسم البند ودرجته.");return}
    await saveSettings({extras:[...cfg().extras,{k:"x"+Date.now().toString(36),label,max}]});toast("أُضيف البند")}
});
async function saveSettings(patch){const c=cfg();const next={school:c.school,subject:c.subject,p1:c.p1,p2:c.p2,extras:c.extras,open:c.open,openWeeks:c.openWeeks,...patch};
  try{await S.db.doc("settings/main").set(next)}catch{toast("تعذّر حفظ الإعدادات: لا تملك صلاحية التعديل.")}}
async function bulkImport(){const lines=$("#bulk").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);const bad=[];const rows=[];
  for(const l of lines){const p=l.split(/\t|,|;|،/).map(x=>x.trim());const nid=(p[0]||"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d));
    if(/^\d{10}$/.test(nid)&&p[1])rows.push({nid,name:p[1],cls:p[2]||""});else bad.push(l)}
  if(!rows.length){$("#eBulk").textContent="لم أجد أسطرًا صالحة. الصيغة: رقم الهوية ثم الاسم.";return}
  let ok=0;for(let i=0;i<rows.length;i+=5){await Promise.all(rows.slice(i,i+5).map(r=>S.db.doc("students/"+r.nid).set(r).then(()=>ok++).catch(()=>{})))}
  $("#eBulk").textContent=bad.length?`تجاهلت ${bad.length} سطرًا غير صالح.`:"";if(ok)$("#bulk").value="";toast(`أُضيف ${ok} طالبًا`)}

function normAr(t){return String(t||"").replace(/^\ufeff/,"").replace(/[٠-٩]/g,d=>"٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[أإآ]/g,"ا").replace(/\s+/g," ").trim().toLowerCase()}
function parseCSV(t){t=t.replace(/^\ufeff/,"");const first=t.split(/\r?\n/)[0]||"";const cnt=c=>first.split(c).length;
  const dl=cnt("\t")>cnt(",")&&cnt("\t")>cnt(";")?"\t":cnt(";")>cnt(",")?";":",";
  const rows=[];let row=[],f="",q=false;
  for(let k=0;k<t.length;k++){const c=t[k];
    if(q){if(c==='"'){if(t[k+1]==='"'){f+='"';k++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===dl){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[k+1]==="\n")k++;row.push(f);f="";if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x.trim()))rows.push(row);return rows}
function rowsFromCSV(t){const all=parseCSV(t);if(all.length<2)throw new Error("الملف فارغ أو لا يحتوي إلا صف العناوين.");
  const h=all[0].map(normAr);const find=re=>h.findIndex(x=>re.test(x));
  const col={name:find(/اسم|name/),id:find(/هوي|سجل|^id$/),w4:find(/(اسبوع|week) ?4|منصه ?1|منصة ?1|^w4$/),w7:find(/(اسبوع|week) ?7|منصه ?2|منصة ?2|^w7$/),w8:find(/حضوري|^w8$/),f:find(/متابع|follow/)};
  if(col.name<0&&col.id<0)throw new Error("لم أجد عمود «اسم الطالب» في الملف.");
  if(col.w4<0&&col.w7<0&&col.w8<0&&col.f<0)throw new Error("لم أجد أعمدة درجات معروفة في الملف.");
  const g=(r,k)=>col[k]<0?0:Number(normAr(r[col[k]]).replace(",","."));
  return all.slice(1).map(r=>({name:col.name<0?"":r[col.name],id:col.id<0?"":normAr(r[col.id]).replace(/\D/g,""),w4:g(r,"w4"),w7:g(r,"w7"),w8:g(r,"w8"),f:g(r,"f")}))}
function nameKey(t){return normAr(t).replace(/[ـ\-–.]/g," ").replace(/ة/g,"ه").replace(/ى/g,"ي").replace(/\s+/g," ").trim()}
function applyRows(rows){const er=$("#eImp");
  const idx=new Map();for(const [nid,st] of S.students){const k=nameKey(st.name);idx.set(k,idx.has(k)?"dup":nid)}
  let dup=0;
  const resolve=r=>{if(r.name){const m=idx.get(nameKey(r.name));if(m==="dup"){dup++;return ""}if(m)return m}return S.students.has(String(r.id||""))?String(r.id):""};
  const v=x=>{x=Number(x);return x>0?x:null};let n=0,miss=0;
  for(const r of rows){const nid=resolve(r);if(!nid){if(r.name||r.id)miss++;continue}
    const ex=[v(r.w4),v(r.w7),v(r.w8)].map((x,i)=>x==null?null:Math.min(x,EXAMS[i].m));const f=v(r.f);
    if(ex.every(x=>x==null)&&f==null)continue;
    editG(nid,g=>{const cur=((g.ex||{}).p1||[null,null,null]).slice();const arr=cur.map((c,i)=>ex[i]!=null?ex[i]:c);g.ex={...(g.ex||{}),p1:arr};const patch={ex:{p1:arr}};
      if(f!=null){const t=Math.min(f,40);g.tov={...(g.tov||{}),p1:t};patch.tov={p1:t}}queue(nid,patch)});n++}
  er.textContent=miss?`${miss} طالبًا في الملف لم تُطابَق أسماؤهم مع الطلاب المسجلين فلم تُنقل درجاتهم${dup?` (منهم ${dup} بأسماء مكررة)`:""}.`:"";
  toast(n?`نُقلت درجات ${n} طالبًا`:"لا توجد درجات مرصودة للنقل (كل القيم أصفار).");return n}
function importOld(){const er=$("#eImp");const t=$("#imp").value.trim();
  if(!t){er.textContent="ارفع ملف CSV أو الصق النص أولًا.";return}
  let rows;
  try{if(t.startsWith("{")){const o=JSON.parse(t);rows=Array.isArray(o&&o.rows)?o.rows:[]}else rows=rowsFromCSV(t)}
  catch(e){er.textContent=e&&e.message&&!/JSON/.test(e.message)?e.message:"النص غير صالح.";return}
  if(!rows.length){er.textContent="لم أجد درجات في النص.";return}
  if(applyRows(rows))$("#imp").value=""}
async function importFile(file){const er=$("#eImp");
  try{const buf=await file.arrayBuffer();let t=new TextDecoder("utf-8").decode(buf);
    if(t.includes("\ufffd")){try{t=new TextDecoder("windows-1256").decode(buf)}catch{}}
    applyRows(rowsFromCSV(t))}
  catch(e){er.textContent=(e&&e.message)||"تعذّرت قراءة الملف."}
  $("#impFile").value=""}

boot();
</script>
